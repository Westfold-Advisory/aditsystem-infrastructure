name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/terraform-*.yml"
      - "bootstrap/**"
      - "config/**"
      - "environments/**"
      - "modules/**"
      - "*.tf"
  push:
    branches: [main]
    paths:
      - ".github/workflows/terraform-*.yml"
      - "bootstrap/**"
      - "config/**"
      - "environments/**"
      - "modules/**"
      - "*.tf"

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A new commit to the same PR supersedes its pending validation. Pushes to
  # main use their ref, so they never cancel an unrelated PR run.
  group: terraform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.12.2
  # Provider binaries only. State, backend configuration, credentials and plan
  # artifacts intentionally remain outside this cache.
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ matrix.environment }}-${{ hashFiles(format('environments/{0}/.terraform.lock.hcl', matrix.environment)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ matrix.environment }}-
      - name: terraform init & validate
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan-local:
    name: Plan without remote state (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    # Plans are an approval signal for the exact PR commit. Re-running this
    # local approximation after merge adds no decision value and can never be
    # reused by the manually approved apply workflow.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ matrix.environment }}-${{ hashFiles(format('environments/{0}/.terraform.lock.hcl', matrix.environment)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ matrix.environment }}-
      - name: terraform plan (local backend)
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform plan -input=false -no-color -detailed-exitcode >/dev/null || exit_code=$?
          case "${exit_code:-0}" in
            0) echo "Terraform plan completed: no changes." ;;
            2) echo "Terraform plan completed: changes detected." ;;
            *) exit "${exit_code}" ;;
          esac

  # Infracost runs after validate, parallel to plan-local, only on PRs.
  # Uses the Infracost CLI directly — no broken sub-actions.
  # Never blocks the pipeline; posts an informational cost estimate comment.
  # Requires: INFRACOST_API_KEY secret + INFRACOST_ENABLED=true variable.
  infracost:
    name: Cost estimate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' && vars.INFRACOST_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ matrix.environment }}-${{ hashFiles(format('environments/{0}/.terraform.lock.hcl', matrix.environment)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ matrix.environment }}-

      # Install Infracost CLI only (the only working sub-action)
      - name: Setup Infracost CLI
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Checkout base branch into a separate worktree so we can diff without
      # switching branches in the main workspace
      - name: Generate cost baseline (base branch)
        run: |
          git worktree add /tmp/base-checkout origin/${{ github.base_ref }}
          infracost breakdown \
            --path /tmp/base-checkout/environments/${{ matrix.environment }} \
            --terraform-init-flags="-backend=false" \
            --format json \
            --out-file /tmp/infracost-base.json

      # Estimate cost on the PR branch and diff against baseline
      - name: Generate cost diff (PR branch)
        run: |
          infracost diff \
            --path environments/${{ matrix.environment }} \
            --terraform-init-flags="-backend=false" \
            --compare-to /tmp/infracost-base.json \
            --format json \
            --out-file /tmp/infracost-diff.json

      # Render the diff as a GitHub-flavoured markdown comment
      - name: Render cost comment
        run: |
          infracost output \
            --path /tmp/infracost-diff.json \
            --format github-comment \
            --out-file /tmp/infracost-comment.md

      # Post or update a single comment per environment using github-script
      - name: Post cost estimate comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            const tag = `<!-- infracost-${env} -->`;
            const rendered = fs.readFileSync('/tmp/infracost-comment.md', 'utf8');
            const body = `${tag}\n### 💰 Coste estimado — \`${env}\`\n\n${rendered}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  plan-remote:
    name: Plan with AWS (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' && vars.TF_REMOTE_STATE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::810626480386:role/aditsystem-terraform-github-actions
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ matrix.environment }}-${{ hashFiles(format('environments/{0}/.terraform.lock.hcl', matrix.environment)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ matrix.environment }}-
      - name: terraform init & plan (remote state)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION || vars.AWS_REGION }}
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform plan -input=false -no-color
