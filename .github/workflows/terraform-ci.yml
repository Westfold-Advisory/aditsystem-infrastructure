name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/terraform-*.yml"
      - "bootstrap/**"
      - "config/**"
      - "environments/**"
      - "modules/**"
      - "*.tf"
  push:
    branches: [main]
    paths:
      - ".github/workflows/terraform-*.yml"
      - "bootstrap/**"
      - "config/**"
      - "environments/**"
      - "modules/**"
      - "*.tf"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: terraform init & validate
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan-local:
    name: Plan without remote state (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false
      - name: terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            const plan = fs.readFileSync('environments/' + env + '/plan.txt', 'utf8');
            const body = `### Terraform plan — \`${env}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan.slice(0, 60000)}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # Infracost runs after validate, parallel to plan-local, only on PRs.
  # Uses the Infracost CLI directly — no broken sub-actions.
  # Never blocks the pipeline; posts an informational cost estimate comment.
  # Requires: INFRACOST_API_KEY secret + INFRACOST_ENABLED=true variable.
  infracost:
    name: Cost estimate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' && vars.INFRACOST_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Infracost CLI only (the only working sub-action)
      - name: Setup Infracost CLI
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Checkout base branch into a separate worktree so we can diff without
      # switching branches in the main workspace
      - name: Generate cost baseline (base branch)
        run: |
          git worktree add /tmp/base-checkout origin/${{ github.base_ref }}
          infracost breakdown \
            --path /tmp/base-checkout/environments/${{ matrix.environment }} \
            --terraform-init-flags="-backend=false" \
            --format json \
            --out-file /tmp/infracost-base.json

      # Estimate cost on the PR branch and diff against baseline
      - name: Generate cost diff (PR branch)
        run: |
          infracost diff \
            --path environments/${{ matrix.environment }} \
            --terraform-init-flags="-backend=false" \
            --compare-to /tmp/infracost-base.json \
            --format json \
            --out-file /tmp/infracost-diff.json

      # Render the diff as a GitHub-flavoured markdown comment
      - name: Render cost comment
        run: |
          infracost output \
            --path /tmp/infracost-diff.json \
            --format github-comment \
            --out-file /tmp/infracost-comment.md

      # Post or update a single comment per environment using github-script
      - name: Post cost estimate comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            const tag = `<!-- infracost-${env} -->`;
            const rendered = fs.readFileSync('/tmp/infracost-comment.md', 'utf8');
            const body = `${tag}\n### 💰 Coste estimado — \`${env}\`\n\n${rendered}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  plan-remote:
    name: Plan with AWS (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: vars.TF_REMOTE_STATE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false
      - name: terraform init & plan (remote state)
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -input=false \
            -backend-config=../../config/backend-${{ matrix.environment }}.hcl
          terraform plan -input=false -no-color -out=tfplan
