name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/terraform-*.yml"
      - "bootstrap/**"
      - "config/**"
      - "environments/**"
      - "modules/**"
      - "*.tf"
  push:
    branches: [main]
    paths:
      - ".github/workflows/terraform-*.yml"
      - "bootstrap/**"
      - "config/**"
      - "environments/**"
      - "modules/**"
      - "*.tf"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: terraform init & validate
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan-local:
    name: Plan without remote state (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false
      - name: terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            const plan = fs.readFileSync('environments/' + env + '/plan.txt', 'utf8');
            const body = `### Terraform plan — \`${env}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan.slice(0, 60000)}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  plan-remote:
    name: Plan with AWS (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: vars.TF_REMOTE_STATE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false
      - name: terraform init & plan (remote state)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"
          terraform plan -input=false -no-color
