name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/terraform-*.yml"
      - "bootstrap/**"
      - "config/**"
      - "environments/**"
      - "modules/**"
      - "*.tf"
  push:
    branches: [main]
    paths:
      - ".github/workflows/terraform-*.yml"
      - "bootstrap/**"
      - "config/**"
      - "environments/**"
      - "modules/**"
      - "*.tf"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: terraform init & validate
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan-local:
    name: Plan without remote state (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false
      - name: terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false -input=false
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            const plan = fs.readFileSync('environments/' + env + '/plan.txt', 'utf8');
            const body = `### Terraform plan — \`${env}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan.slice(0, 60000)}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # Infracost runs after validate, parallel to plan-local, only on PRs.
  # It never blocks the pipeline — it posts an informational cost estimate comment.
  # Requires the INFRACOST_API_KEY secret (free tier at infracost.io).
  infracost:
    name: Cost estimate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' && vars.INFRACOST_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so infracost diff can compare against base branch
          fetch-depth: 0

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Generate cost estimate for the base branch (what is currently deployed)
      - name: Generate Infracost baseline
        run: |
          infracost breakdown \
            --path environments/${{ matrix.environment }} \
            --terraform-init-flags="-backend=false" \
            --format json \
            --out-file /tmp/infracost-base-${{ matrix.environment }}.json
        env:
          INFRACOST_TERRAFORM_WORKSPACE: ${{ matrix.environment }}

      # Generate cost estimate for the PR branch (what will be deployed)
      - name: Generate Infracost diff
        run: |
          infracost diff \
            --path environments/${{ matrix.environment }} \
            --terraform-init-flags="-backend=false" \
            --format json \
            --compare-to /tmp/infracost-base-${{ matrix.environment }}.json \
            --out-file /tmp/infracost-diff-${{ matrix.environment }}.json
        env:
          INFRACOST_TERRAFORM_WORKSPACE: ${{ matrix.environment }}

      # Post cost diff as a PR comment (updates existing comment on re-runs)
      - name: Post Infracost comment
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost-diff-${{ matrix.environment }}.json
          behavior: update
          tag: infracost-${{ matrix.environment }}

  plan-remote:
    name: Plan with AWS (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    if: vars.TF_REMOTE_STATE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false
      - name: terraform init & plan (remote state)
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -input=false \
            -backend-config=../../config/backend-${{ matrix.environment }}.hcl
          terraform plan -input=false -no-color

      # When AWS is available, also run Infracost with the real plan JSON
      # for a more accurate estimate (replaces the HCL-based estimate above).
      - name: Generate Infracost estimate from plan
        if: github.event_name == 'pull_request' && vars.INFRACOST_ENABLED == 'true'
        run: |
          terraform -chdir=environments/${{ matrix.environment }} \
            show -json tfplan 2>/dev/null > /tmp/plan-${{ matrix.environment }}.json || true
          if [ -s /tmp/plan-${{ matrix.environment }}.json ]; then
            infracost diff \
              --path /tmp/plan-${{ matrix.environment }}.json \
              --format json \
              --out-file /tmp/infracost-remote-${{ matrix.environment }}.json
          fi
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
