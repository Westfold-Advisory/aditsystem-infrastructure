name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno a aplicar
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

# Never cancel an in-flight apply: serialize it per target environment instead.
concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.12.2
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: >-
      ${{
        inputs.environment == 'prod' && 'production' ||
        'development'
      }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # ARN is an identifier, not a credential. Keeping it here prevents
          # an empty environment secret from silently disabling OIDC.
          role-to-assume: arn:aws:iam::810626480386:role/aditsystem-terraform-github-actions
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ inputs.environment }}-${{ hashFiles(format('environments/{0}/.terraform.lock.hcl', inputs.environment)) }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ env.TERRAFORM_VERSION }}-${{ inputs.environment }}-
      - name: terraform apply
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION || vars.AWS_REGION }}
        working-directory: environments/${{ inputs.environment }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
